# =============================================================================
# Build and publish the comlink image to GHCR.
#
# CI's ONLY job is to publish an immutable, signed artifact. It pushes
# ghcr.io/chaosbit-dev/comlink with the run's own GITHUB_TOKEN. There is no
# registry credential in this (public) repo, no `environment: release`, and no
# cluster credentials: Flux on Gonk watches the registry, selects the newest
# build by timestamp, rewrites the image tag in gonk-infra, and reconciles.
#
# Tag pushed:
#   :main-<sha7>-<unixts>    SORTABLE — this is what Flux's ImagePolicy ranks
#                            (numerical on the timestamp).
#
# The image is signed keyless (cosign, GitHub OIDC) and carries an SBOM and
# SLSA provenance attestation. Nothing is published on pull requests.
# =============================================================================

name: build-and-push

on:
  push:
    branches: [main]
  # Build-only (no push, no credentials): proves the image still builds.
  pull_request:
  # Manual rebuild of main, e.g. after registry damage (gonk-infra#877).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GATE. Flux selects the newest tag on its own, so an unconditional push
  # means a red build reaches the cluster unattended (2026-09-18, mcp 2.x).
  check:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  # PRs (including forks) only prove the image builds: nothing is pushed.
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false

  # Only the default branch publishes: a dispatch on any other ref must not
  # reach the tag stream Flux deploys from.
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    env:
      IMAGE: ghcr.io/chaosbit-dev/comlink
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned as in chaosbit-dev/obsidian-git-mcp@0865acf. github.token, not a
      # repository-secret reference: this workflow has a pull_request trigger (pr-build),
      # and no workflow a pull request can trigger may name a secret
      # (KAMINO-IDENT-SECRET-004). It is the same token.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata (sortable tag)
        id: meta
        run: |
          echo "sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Links the package to this public repository, so it is published public.
          labels: org.opencontainers.image.source=https://github.com/chaosbit-dev/comlink
          tags: ghcr.io/chaosbit-dev/comlink:main-${{ steps.meta.outputs.sha7 }}-${{ steps.meta.outputs.ts }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/chaosbit-dev/comlink@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM (keyless, stored in GHCR)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

      - name: Write the build provenance predicate
        run: |
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg workflow "${GITHUB_WORKFLOW_REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              buildDefinition: {
                buildType: "https://actions.github.io/buildtypes/workflow/v1",
                externalParameters: {
                  workflow: {repository: ("https://github.com/" + $repository), ref: $ref, path: ".github/workflows/build-push.yml"},
                  sha: $sha
                },
                internalParameters: {workflowRef: $workflow}
              },
              runDetails: {
                builder: {id: ("https://github.com/" + $repository + "/.github/workflows/build-push.yml@" + $ref)},
                metadata: {invocationId: $run_url, runId: $run_id}
              }
            }' > provenance.json

      - name: Attest the build provenance (keyless, stored in GHCR)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type slsaprovenance1 --predicate provenance.json "${IMAGE}@${DIGEST}"
