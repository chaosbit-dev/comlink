# =============================================================================
# Reference build-and-push workflow for Gonk image repos (GitOps / Flux model).
#
# This is a TEMPLATE. Copy it into each image repo (comlink, homeassistant-mcp,
# …) as .github/workflows/build-push.yml.
#
# CI's ONLY job is to publish an immutable artifact. It builds the image and
# pushes it to registry.home.chaosbit.dev over an ephemeral tailnet join. It has
# NO cluster credentials and NO write access to gonk-infra.
#
# Deployment is pull-based: Flux on Gonk watches the registry, selects the newest
# build by timestamp, rewrites the image tag in gonk-infra, and reconciles. See
# clusters/gonk/comlink*.yaml and the Flux runbook in the gonk-infra README.
#
# Tags pushed:
#   :latest                  convenience / humans
#   :<sha>                   immutable, for manual pinning / rollback
#   :main-<sha7>-<unixts>    SORTABLE — this is what Flux's ImagePolicy ranks
#                            (numerical on the timestamp). Without a sortable
#                            tag Flux can't tell which image is newest.
#
# -----------------------------------------------------------------------------
# Required GitHub secrets (org level, chaosbit-dev, scoped to this repo)
# -----------------------------------------------------------------------------
#   TS_OAUTH_CLIENT_ID   Tailscale OAuth client ID (tagged tag:ci).
#   TS_OAUTH_SECRET      Tailscale OAuth client secret.
#   REGISTRY_USERNAME    Registry user. Currently "ci".
#   REGISTRY_PASSWORD    The `ci` bcrypt password (from scripts/registry-htpasswd.sh).
# (No GONK_INFRA_DEPLOY_TOKEN and no kube credentials — Flux owns deploy.)
# =============================================================================

name: build-and-push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image metadata (sortable tag)
        id: meta
        run: |
          echo "sha7=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login registry.home.chaosbit.dev \
                -u "${{ secrets.REGISTRY_USERNAME }}" \
                --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            registry.home.chaosbit.dev/${{ github.event.repository.name }}:latest
            registry.home.chaosbit.dev/${{ github.event.repository.name }}:${{ github.sha }}
            registry.home.chaosbit.dev/${{ github.event.repository.name }}:main-${{ steps.meta.outputs.sha7 }}-${{ steps.meta.outputs.ts }}
