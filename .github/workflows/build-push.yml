# =============================================================================
# Reference build-and-push workflow for Gonk image repos.
#
# This is a TEMPLATE. It does not run from gonk-infra. Copy it into each image
# repo (comlink, homeassistant-mcp, etc.) as .github/workflows/build-push.yml.
# It builds the repo's image and pushes it to the private registry on Gonk
# (registry.home.chaosbit.dev), which is reachable only over Tailscale.
#
# -----------------------------------------------------------------------------
# Required GitHub secrets (repo or org level)
# -----------------------------------------------------------------------------
#   TS_OAUTH_CLIENT_ID   Tailscale OAuth client ID (tagged tag:ci).
#   TS_OAUTH_SECRET      Tailscale OAuth client secret.
#   REGISTRY_USERNAME    Registry user. Currently "ci".
#   REGISTRY_PASSWORD    The `ci` bcrypt password (same one in Vaultwarden,
#                        the Gonk keychain, and /etc/rancher/k3s/registries.yaml).
#                        Generated by gonk-infra scripts/registry-htpasswd.sh.
#
# -----------------------------------------------------------------------------
# One-time Tailscale setup (do once for the whole tailnet, not per repo)
# -----------------------------------------------------------------------------
#  1. Create a TAGGED OAuth client (Tailscale admin -> Settings -> OAuth clients)
#     scoped to tag:ci. Save the client ID + secret as the GitHub secrets above.
#
#     Why an OAuth client and NOT a static auth key: the OAuth client mints a
#     fresh, EPHEMERAL node key per run. The runner joins, pushes, and the node
#     auto-deregisters when the job ends — no dead `ubuntu-runner` devices pile
#     up in the tailnet device list, and there is no long-lived key to leak or
#     rotate. A static reusable auth key does the opposite: lingering devices and
#     a standing credential.
#
#  2. ACL: allow tag:ci to reach Gonk's Traefik on 443. In the tailnet policy:
#
#       "acls": [
#         { "action": "accept", "src": ["tag:ci"], "dst": ["tag:server:443"] }
#       ]
#
#     Adjust the dst to however Gonk is tagged. 443 = Traefik websecure, the only
#     door the registry has. tag:ci needs nothing else.
#
# -----------------------------------------------------------------------------
# How resolution works (Approach 1 — confirmed, no split-DNS dependency)
# -----------------------------------------------------------------------------
#   registry.home.chaosbit.dev resolves via PUBLIC DNS:
#     registry.home.chaosbit.dev -> CNAME home.chaosbit.dev -> 100.76.45.73
#   That A record is Gonk's tailnet IP. An ephemeral runner resolves the name
#   over normal public DNS with zero MagicDNS / tailnet-DNS configuration, then
#   reaches the IP over the tailnet once joined. The cert is publicly trusted
#   (DNS-01 via Cloudflare, *.home.chaosbit.dev) so no insecure-registries hacks.
# =============================================================================

name: build-and-push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Join tailnet (ephemeral)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Log in to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login registry.home.chaosbit.dev \
                -u "${{ secrets.REGISTRY_USERNAME }}" \
                --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            registry.home.chaosbit.dev/${{ github.event.repository.name }}:latest
            registry.home.chaosbit.dev/${{ github.event.repository.name }}:${{ github.sha }}
