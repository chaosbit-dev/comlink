[project]
name = "comlink"
version = "0.1.0"
description = "Proton Mail MCP server speaking to Proton Mail Bridge's local IMAP/SMTP endpoints"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "imapclient>=3.0.1",
    "aiosmtplib>=3.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anyio>=4.4.0",
]

[project.scripts]
comlink = "comlink.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live Proton Mail Bridge (excluded from the default run)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# experiments/ holds throwaway debugging tooling (auth probes, CF API scripts),
# not shipped package code — excluded from the lint gate.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# N818: the error taxonomy names are fixed by the design doc (§8) — BridgeUnavailable,
# AuthFailed, FolderNotFound, etc. are the agent-facing contract, not free to rename.
ignore = ["N818"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = "imapclient.*"
ignore_missing_imports = true
