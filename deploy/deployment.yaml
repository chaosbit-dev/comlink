apiVersion: apps/v1
kind: Deployment
metadata:
  name: comlink
  namespace: comlink
  labels:
    app.kubernetes.io/name: comlink
    app.kubernetes.io/part-of: comlink
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  # Single-node K3s + a single streamable-http session affinity story: don't run
  # two replicas during a rollout. Recreate keeps exactly one Comlink at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: comlink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comlink
        app.kubernetes.io/part-of: comlink
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        # Pod-level: run as the image's nonroot UID/GID, drop into a fixed
        # supplemental group, and disallow privilege escalation cluster-side.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: comlink
          # Immutable tag, built + imported on Gonk (no external registry).
          # imagePullPolicy IfNotPresent => kubelet uses the locally imported
          # image and never reaches out to a registry for this tag. The tag here
          # MUST match the tag used in `docker save` / `ctr images import`
          # (see deploy/README.md) or the pod will ImagePullBackOff.
          image: comlink:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # --- Account + Bridge endpoint (in-cluster Service) ---------------
            - name: COMLINK_USERNAME
              value: "brandon@chaosbit.dev"
            - name: COMLINK_IMAP_HOST
              value: "proton-bridge.proton-bridge.svc.cluster.local"
            - name: COMLINK_IMAP_PORT
              value: "1143"
            # --- TLS: pin the self-signed Bridge cert, skip hostname match -----
            # Bridge issues its cert for localhost/127.0.0.1, not the in-cluster
            # DNS name, so plain "verify" fails the hostname check. verify-no-hostname
            # keeps CERT_REQUIRED against the pinned cert and only skips hostname
            # matching. The cert is mounted from the bridge-cert ConfigMap below.
            - name: COMLINK_TLS_MODE
              value: "verify-no-hostname"
            - name: COMLINK_TLS_CERT_PATH
              value: "/etc/comlink/bridge.crt"
            # --- Read-only: only the 5 read tools register --------------------
            # No send/delete tools => append_audit is never reached, so there is
            # deliberately NO audit-log PVC mounted. Do not add one here; if this
            # ever flips to read_only=false you must also provision durable
            # storage for COMLINK_AUDIT_LOG.
            - name: COMLINK_READ_ONLY
              value: "true"
            # --- Transport: streamable-http behind cloudflared + CF Access ----
            - name: COMLINK_TRANSPORT
              value: "streamable-http"
            - name: COMLINK_HTTP_HOST
              value: "0.0.0.0"
            - name: COMLINK_HTTP_PORT
              value: "8000"
            - name: COMLINK_HTTP_PATH
              value: "/mcp"
            # DNS-rebinding protection: only this Host header is accepted. The
            # cloudflared tunnel MUST forward the original Host (mcp-comlink.chaosbit.dev)
            # or every request is rejected. See deploy/README.md cutover step.
            - name: COMLINK_HTTP_ALLOWED_HOSTS
              value: "mcp-comlink.chaosbit.dev"
            # --- Cloudflare Access JWT gate (defense-in-depth) ----------------
            # In-process re-validation of the Cf-Access-Jwt-Assertion header so a
            # direct in-cluster hit on the ClusterIP cannot bypass edge auth. The
            # AUD tag and team domain are identifiers, not secrets.
            - name: COMLINK_ACCESS_AUD
              value: "35ba36c80296906ab5be03919ca0ee66e058fac2d23a9bd861edb34e77615300"
            - name: COMLINK_ACCESS_TEAM_DOMAIN
              value: "chaosbit.cloudflareaccess.com"
            - name: COMLINK_ACCESS_ALLOWED_EMAILS
              value: "brandon@chaosbit.dev,brandon.luttrell@att.net"
            # STAYS false until we confirm OUT-OF-BAND that Cloudflare injects the
            # Cf-Access-Jwt-Assertion header on the Claude-app Managed-OAuth path.
            # Flipping to true before that is verified would 401-block the working
            # read path. The middleware logs a WARNING on every header-less request,
            # which is the signal to watch before flipping this.
            - name: COMLINK_REQUIRE_ACCESS_JWT
              value: "false"
            # --- Bridge app password from the Secret --------------------------
            - name: COMLINK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comlink-bridge
                  key: password
          volumeMounts:
            # Pinned Bridge cert, read-only, at the path COMLINK_TLS_CERT_PATH expects.
            - name: bridge-cert
              mountPath: /etc/comlink
              readOnly: true
            # readOnlyRootFilesystem requires a writable scratch dir for /tmp.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Probes are PROCESS-UP ONLY: a TCP connect to the HTTP port. They do
          # NOT touch Bridge — a Bridge restart must never crash-loop Comlink.
          # Bridge-aware readiness (e.g. an IMAP-backed health route) is DEFERRED;
          # for now liveness/readiness mean "the MCP HTTP listener is accepting
          # connections", nothing about upstream mail reachability.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: bridge-cert
          configMap:
            # Created from ~/comlink/bridge.crt — see deploy/README.md:
            #   kubectl -n comlink create configmap bridge-cert \
            #       --from-file=bridge.crt=./bridge.crt
            name: bridge-cert
        - name: tmp
          emptyDir: {}
