# TEMPLATE ONLY — do NOT commit a real secret, and do NOT `kubectl apply` this file.
#
# This documents the shape of the Secret that the Deployment expects. The real
# Secret holds the Proton Mail Bridge APP PASSWORD (not the Proton account
# password), which the user keeps in Vaultwarden.
#
# Create it imperatively from Vaultwarden instead of applying this YAML, so the
# plaintext never lands in a file or in git. See deploy/README.md:
#
#   PW="$(bw get password 'Proton Bridge app password')"   # from Vaultwarden/bw CLI
#   kubectl -n comlink create secret generic comlink-bridge \
#       --from-literal=password="$PW"
#   unset PW
#
# The Deployment reads it via secretKeyRef -> name: comlink-bridge, key: password,
# surfaced as the COMLINK_PASSWORD env var.
apiVersion: v1
kind: Secret
metadata:
  name: comlink-bridge
  namespace: comlink
type: Opaque
stringData:
  # Placeholder — replace via the `kubectl create secret` command above.
  password: "REPLACE_ME_WITH_BRIDGE_APP_PASSWORD"
